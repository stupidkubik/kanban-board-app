version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # A dependency joins the first group that matches it, so the
    # move-together groups come before the generic minor/patch ones.
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # firebase 13 and @firebase/rules-unit-testing 6 must move together (peer).
      # firebase-admin stays out: its majors need a separate preview migration
      # (docs/OPERATIONS.md, "Dependency policy").
      firebase:
        patterns: ["firebase", "@firebase/*"]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep Node.js types on the runtime line pinned in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (bundled by eslint-config-next) does not support TS 7 yet.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-plugin-import (via eslint-config-next) still declares peer eslint ^9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
